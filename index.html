<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saha Bilgini</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ana Menü Ekranı -->
    <div id="main-menu" class="main-menu">
        <div class="menu-content">
            <h1>SAHA BİLGİNİ</h1>
            <p>40 Level - 400 Soru ile Futbol Kültürünü Test Et!</p>
            <button id="start-btn" class="btn-primary">Oyuna Başla</button>
        </div>
    </div>

    <!-- Yükleniyor / Geçiş Ekranı -->
    <div id="loading-screen" class="loading-screen" style="display: none;">
        <div class="loader-content">
            <div class="spinner">⚽</div>
            <h2>Maça Hazırlanılıyor...</h2>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Oyun Ekranı -->
    <div id="game-screen" class="game-screen" style="display: none;">
        <div class="game-header">
            <button id="home-btn" class="icon-btn">🏠</button>
            <div id="level-counter" class="badge">Level: 1/40</div>
            <div id="question-counter" class="badge">Soru: 1/10</div>
            <div id="score-display" class="badge">⭐ 0</div>
        </div>

        <div class="jokers-container">
            <button id="fifty-joker" class="joker-btn">✂️ 50:50</button>
            <button id="pass-joker" class="joker-btn">⏭️ Pas Geç</button>
        </div>

        <div class="question-container">
            <h2 id="question-text">Soru metni yükleniyor...</h2>
        </div>

        <div class="options-container">
            <button class="option-btn" data-index="0">Seçenek 1</button>
            <button class="option-btn" data-index="1">Seçenek 2</button>
            <button class="option-btn" data-index="2">Seçenek 3</button>
            <button class="option-btn" data-index="3">Seçenek 4</button>
        </div>

        <!-- Görsel Animasyon Katmanı (Gol / Kırmızı Kart) -->
        <div id="game-feedback-overlay" class="feedback-overlay">
            <div id="feedback-content" class="feedback-box">
                <span id="feedback-icon">⚽</span>
                <h2 id="feedback-text">GOL!</h2>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
