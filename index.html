<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Bilgi Yarışması</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="splash-bg.jpg" alt="Futbol Bilgini" class="bg">
        <div class="loader-container">
            <div class="loader-circle"><div class="loader-ring"></div><div class="loader-ball">⚽</div></div>
            <div class="loading-text">YÜKLENİYOR...</div>
            <div class="loading-percent" id="splash-percent">0%</div>
        </div>
    </div>

    <div id="menu-screen" class="screen active">
        <div class="top-panel">
            <div class="profile-box"><span class="profile-icon">👤</span><span class="profile-name">Oyuncu</span></div>
            <div class="stats-box"><span class="stat-icon">⭐</span><span id="total-stars-display">0</span></div>
            <div class="stats-box"><span class="stat-icon">🪙</span><span id="total-coins-display">0</span></div>
        </div>
        <div class="logo-container"><h1 class="game-logo">FUTBOL<br><span>BİLGİ YARIŞMASI</span></h1></div>
        <div class="menu-buttons">
            <button class="menu-btn btn-play" onclick="showLevelScreen()">▶️ OYUNA BAŞLA</button>
            <button class="menu-btn btn-spin" onclick="showSpinScreen()">🎡 ÇARKIFELEK</button>
            <button class="menu-btn btn-settings" onclick="showSettingsScreen()">⚙️ AYARLAR</button>
            <button class="menu-btn btn-howto" onclick="alert('Her levelde 10 soru vardır. Doğru cevaplarla yıldız ve coin kazan!')">📖 NASIL OYNANIR</button>
        </div>
    </div>

    <div id="settings-screen" class="screen">
        <div class="settings-header"><h2>⚙️ Ayarlar</h2><button class="back-menu-btn" onclick="showMenuScreen()">← Ana Menü</button></div>
        <div class="settings-list">
            <div class="setting-item"><span>Ses Efektleri</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
            <div class="setting-item"><span>Titreşim</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
            <div class="setting-item"><span>Verileri Sıfırla</span><button class="reset-btn" onclick="resetGame()">Sıfırla</button></div>
        </div>
    </div>

    <!-- YENİ: ÇARKIFELEK EKRANI -->
    <div id="spin-screen" class="screen">
        <div class="spin-header">
            <button class="back-menu-btn" onclick="showMenuScreen()">← Ana Menü</button>
            <div class="stats-box"><span class="stat-icon">🪙</span><span id="spin-coins-display">0</span></div>
        </div>
        <div class="wheel-container">
            <div class="wheel-pointer">▼</div>
            <canvas id="wheel-canvas" width="320" height="320"></canvas>
            <button class="spin-btn" id="spin-btn" onclick="spinWheel()">SPIN 🎡</button>
        </div>
        <p class="spin-timer" id="spin-timer-text">Ücretsiz Çevirme: Hazır!</p>
    </div>

    <div id="levels-screen" class="screen">
        <div class="screen-header"><span>Level Seçin</span><button class="back-menu-btn" onclick="showMenuScreen()">← Ana Menü</button></div>
        <div class="levels-container" id="levels-container"></div>
        <button class="ad-btn" onclick="watchAdForStars()">📺 Reklam izle (+5 ⭐ Kazan)</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="quiz-header"><span id="question-counter">Soru 1/10</span><div class="timer-circle"><span id="timer-text">30s</span></div></div>
        <div class="question-box" id="question-text">Soru yükleniyor...</div>
        <div class="jokers-container">
            <button class="joker-btn" id="joker-5050" onclick="useJoker('5050')" title="Yarı Yarıya">✂️ <span class="joker-price">20</span></button>
            <button class="joker-btn" id="joker-answer" onclick="useJoker('answer')" title="Doğru Cevap">🎯 <span class="joker-price">40</span></button>
            <button class="joker-btn" id="joker-double" onclick="useJoker('double')" title="Çift Cevap Hakkı">❤️ <span class="joker-price">60</span></button>
        </div>
        <div class="options-list" id="options-container"></div>
    </div>

    <div id="score-screen" class="screen">
        <div class="score-content">
            <div class="big-stars" id="result-stars">⭐⭐⭐</div>
            <h2 id="final-score-text">SKOR: 0</h2>
            <p id="final-correct-text">Doğru Sayısı: 0/10</p>
            <button class="menu-btn btn-play" onclick="restartLevel()">🔄 TEKRAR OYNA</button>
            <button class="menu-btn btn-settings" onclick="showLevelScreen()">📋 LEVEL LİSTESİ</button>
        </div>
    </div>

    <div id="unlock-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeUnlockModal()">✖</button>
            <h2 class="modal-title">UNLOCK LEVEL</h2>
            <div class="modal-lock-icon">🔐</div>
            <div class="modal-required">⭐ <span id="modal-required-stars">0</span></div>
            <p class="modal-subtext">TO UNLOCK THIS LEVEL</p>
            <button class="modal-unlock-btn" id="modal-unlock-btn" onclick="unlockLevelWithCoins()">UNLOCK NOW 🪙 <span id="modal-coin-cost">0</span></button>
            <p class="modal-coin-status" id="modal-coin-status"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
