<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Bilgi Yarışması - 40 Level</title>
    <style>
        :root {
            --primary-color: #10b981;
            --secondary-color: #3b82f6;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --star-color: #f59e0b;
            --locked-bg: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* Ana Menü */
        .menu-screen { text-align: center; padding: 30px 0; }
        .menu-btn {
            background: linear-gradient(135deg, var(--primary-color), #059669);
            color: #0f172a;
            border: none;
            padding: 16px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .menu-btn:hover { transform: scale(1.02); }

        /* Level Seçim - Yeni Kart Tasarımı */
        .levels-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 65vh; /* Ekrana sığması için kaydırma */
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        /* Scrollbar Güzelleştirme */
        .levels-container::-webkit-scrollbar { width: 6px; }
        .levels-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .level-card {
            display: flex;
            align-items: center;
            background: linear-gradient(90deg, #2e3b4e 0%, #1e293b 100%);
            border: 2px solid #3b4d66;
            border-radius: 12px;
            padding: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 70px;
        }
        .level-card:active { transform: scale(0.98); }

        /* Kilitli Kart Görünümü */
        .level-card.locked {
            filter: grayscale(0.8);
            opacity: 0.7;
            cursor: not-allowed;
            background: #1e293b;
            border-color: #334155;
        }
        .level-card.locked:hover { transform: none; }

        /* Karakter İkonu (Sol Taraf) */
        .level-avatar {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            background-color: #0f172a;
            border: 2px solid #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 12px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .level-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* Orta Kısım - Bilgi */
        .level-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .level-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f8fafc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .level-progress-bar {
            width: 100%;
            height: 12px;
            background-color: #0f172a;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .level-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .level-stars {
            font-size: 0.8rem;
            color: var(--star-color);
            letter-spacing: 2px;
        }

        /* Sağ Taraf - Kilit veya Ödül */
        .level-status {
            width: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            margin-left: 10px;
        }
        .lock-icon { color: #64748b; }
        .trophy-icon { color: #f59e0b; }

        /* Quiz Ekranı (Aynı kaldı) */
        .quiz-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .question-box {
            font-size: 1.15rem;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
            min-height: 60px;
        }
        .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn {
            background-color: #2e3b4e;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) { background-color: #3b4d66; border-color: var(--primary-color); }
        .option-btn.correct { background-color: rgba(16, 185, 129, 0.25); border-color: var(--primary-color); color: #34d399; }
        .option-btn.incorrect { background-color: rgba(239, 68, 68, 0.25); border-color: var(--danger-color); color: #f87171; }
        .option-btn:disabled { cursor: default; }

        .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .action-btn {
            background-color: var(--primary-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
        .back-menu-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .back-menu-btn:hover { color: var(--text-color); border-color: var(--text-color); }

        /* Sonuç Ekranı */
        .score-card { text-align: center; }
        .score-card h2 { font-size: 1.8rem; margin-bottom: 10px; color: var(--primary-color); }
        .big-stars { font-size: 2.5rem; color: var(--star-color); margin: 15px 0; }
        .result-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚽ Futbol Bilgi Yarışması</h1>

        <!-- 1. ANA MENÜ EKRANI -->
        <div id="menu-screen" class="screen active menu-screen">
            <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem; line-height: 1.6;">
                40 Farklı Level ve 400 Soruluk dev futbol arşivine hoş geldiniz!<br>
                Bilginizi test edin, tüm yıldızları toplayın.
            </p>
            <button class="menu-btn" onclick="showLevelScreen()">Oyuna Başla / Level Seç</button>
        </div>

        <!-- 2. LEVEL SEÇİM EKRANI (YENİ TASARIM) -->
        <div id="levels-screen" class="screen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-weight: bold; color: var(--text-color); font-size: 1.1rem;">Level Seçin</span>
                <button class="back-menu-btn" onclick="showMenuScreen()">← Ana Menü</button>
            </div>
            
            <!-- Level Kartlarının Geleceği Yer -->
            <div class="levels-container" id="levels-container"></div>
        </div>

        <!-- 3. OYUN / QUIZ EKRANI -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-info">
                <span id="level-title-indicator">Level 1</span>
                <span id="question-counter">Soru: 1 / 10</span>
                <span id="score-display">Puan: 0</span>
            </div>
            <div class="question-box" id="question-text">Soru yükleniyor...</div>
            <div class="options-list" id="options-container"></div>
            <div class="footer-nav">
                <button class="back-menu-btn" onclick="showLevelScreen()">Levellere Dön</button>
                <button class="action-btn" id="next-btn" onclick="nextQuestion()">Sonraki Soru</button>
            </div>
        </div>

        <!-- 4. SONUÇ EKRANI -->
        <div id="score-screen" class="screen score-card">
            <h2>Level Tamamlandı!</h2>
            <div class="big-stars" id="result-stars">⭐⭐⭐</div>
            <p id="final-score-text" style="font-size: 1.1rem; margin-bottom: 10px;"></p>
            <div class="result-actions">
                <button class="back-menu-btn" onclick="showLevelScreen()">Level Listesi</button>
                <button class="action-btn" style="display:inline-block;" onclick="restartLevel()">Tekrar Oyna</button>
            </div>
        </div>
    </div>

    <script>
        // 40 Level - Her birinde 10 soru
        const levelsData = [];
        
        const sampleBaseQuestions = [
            { soru: "Futbol maçında sahada her bir takım kaç oyuncuyla yer alır?", secenekler: ["9", "10", "11", "12"], dogru: 2 },
            { soru: "Standart bir futbol maçı normal sürede toplam kaç dakikadır?", secenekler: ["80", "90", "100", "120"], dogru: 1 },
            { soru: "Hakemin oyuncuyu ihraç etmek için gösterdiği kartın rengi nedir?", secenekler: ["Sarı", "Kırmızı", "Mavi", "Yeşil"], dogru: 1 },
            { soru: "Kendi ceza sahası dışındayken elleriyle topu tutabilen tek oyuncu kimdir?", secenekler: ["Stoper", "Forvet", "Kaleci", "Kaptan"], dogru: 2 },
            { soru: "Topun taç çizgisini tamamen geçmesiyle hangi atış kullanılır?", secenekler: ["Korner", "Taç atışı", "Penaltı", "Aut"], dogru: 1 },
            { soru: "Ofsayt kuralı hangi alanda geçerlidir?", secenekler: ["Rakip yarı alanda", "Kendi yarı alanında", "Tüm sahada", "Orta yuvarlakta"], dogru: 0 },
            { soru: "Penaltı vuruşu kaleye kaç metre mesafeden yapılır?", secenekler: ["9 metre", "11 metre", "12 metre", "14 metre"], dogru: 1 },
            { soru: "Süper Lig'in kuruluş yılı resmi olarak hangisidir?", secenekler: ["1923", "1959", "1967", "1980"], dogru: 1 },
            { soru: "Şampiyonlar Ligi kupasını en çok kazanan kulüp hangisidir?", secenekler: ["AC Milan", "Barcelona", "Real Madrid", "Bayern Münih"], dogru: 2 },
            { soru: "Dünya Kupası organizasyonu kaç yılda bir düzenlenir?", secenekler: ["2", "3", "4", "5"], dogru: 2 }
        ];

        for (let l = 1; l <= 40; l++) {
            let qList = [];
            for (let q = 1; q <= 10; q++) {
                let baseQ = sampleBaseQuestions[(q + l - 2) % sampleBaseQuestions.length];
                qList.push({
                    soru: `[Level ${l}] ${baseQ.soru} (Soru ${q})`,
                    secenekler: baseQ.secenekler,
                    dogru: baseQ.dogru
                });
            }
            levelsData.push(qList);
        }

        let currentLevelIndex = 0;
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        
        // Kullanıcı ilerleme kayıtları (LocalStorage)
        // Yapı: { "0": { stars: 3, score: 100, unlocked: true }, "1": { stars: 0, score: 0, unlocked: false } }
        let userProgress = JSON.parse(localStorage.getItem('futbol_quiz_progress')) || {};

        // İlk level her zaman açık
        if (!userProgress[0]) {
            userProgress[0] = { stars: 0, score: 0, unlocked: true };
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showMenuScreen() {
            showScreen('menu-screen');
        }

        function showLevelScreen() {
            const container = document.getElementById('levels-container');
            container.innerHTML = '';

            for (let i = 0; i < 40; i++) {
                let lvlNum = i + 1;
                let progress = userProgress[i] || { stars: 0, score: 0, unlocked: false };
                
                // Eğer önceki level 1 yıldız bile alsa bir sonrakini açar
                let isUnlocked = progress.unlocked || (i === 0) || (userProgress[i-1] && userProgress[i-1].stars > 0);

                let card = document.createElement('div');
                card.className = 'level-card' + (isUnlocked ? '' : ' locked');
                
                // Karakter İkonu (Örnek: İlk 4 seviye için farklı ikonlar)
                let avatarContent = '⚽';
                if (i === 0) avatarContent = '🐐'; // GOAT
                else if (i === 1) avatarContent = '🐢'; // Mbappe tarzı
                else if (i === 2) avatarContent = '🤖'; // Haaland tarzı
                else if (i === 3) avatarContent = '👑'; // Kral

                // Yıldız Gösterimi
                let starsStr = '☆☆☆';
                if (progress.stars === 1) starsStr = '⭐☆☆';
                if (progress.stars === 2) starsStr = '⭐⭐☆';
                if (progress.stars === 3) starsStr = '⭐⭐⭐';

                // İlerleme Çubuğu Yüzdesi (Örnek: 10 sorunun kaçını yaptı)
                let progressPercent = (progress.stars / 3) * 100; 

                card.innerHTML = `
                    <div class="level-avatar">${avatarContent}</div>
                    <div class="level-info">
                        <div class="level-title">LEVEL ${lvlNum}</div>
                        <div class="level-progress-bar">
                            <div class="level-progress-fill" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="level-stars">${starsStr}</div>
                    </div>
                    <div class="level-status">
                        ${isUnlocked ? '<span class="trophy-icon">🏆</span>' : '<span class="lock-icon">🔒</span>'}
                    </div>
                `;

                if (isUnlocked) {
                    card.onclick = () => startLevel(i);
                } else {
                    card.onclick = () => alert("Bu level kilitli! Lütfen önceki leveli en az 1 yıldızla tamamlayın.");
                }

                container.appendChild(card);
            }
            showScreen('levels-screen');
        }

        function startLevel(levelIndex) {
            currentLevelIndex = levelIndex;
            currentQuestionIndex = 0;
            score = 0;
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').style.display = "none";

            const currentQ = levelsData[currentLevelIndex][currentQuestionIndex];
            document.getElementById('level-title-indicator').innerText = `Level ${currentLevelIndex + 1}`;
            document.getElementById('question-counter').innerText = `Soru: ${currentQuestionIndex + 1} / 10`;
            document.getElementById('score-display').innerText = `Puan: ${score}`;
            document.getElementById('question-text').innerText = currentQ.soru;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = "";

            currentQ.secenekler.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const currentQ = levelsData[currentLevelIndex][currentQuestionIndex];
            const buttons = document.getElementById('options-container').getElementsByClassName("option-btn");

            if (selectedIndex === currentQ.dogru) {
                selectedBtn.classList.add("correct");
                score += 10;
                document.getElementById('score-display').innerText = `Puan: ${score}`;
            } else {
                selectedBtn.classList.add("incorrect");
                buttons[currentQ.dogru].classList.add("correct");
            }

            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (currentQuestionIndex < 9) {
                document.getElementById('next-btn').style.display = "block";
            } else {
                setTimeout(showResults, 1000);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function showResults() {
            showScreen('score-screen');
            
            // Yıldız Hesaplama
            let starsEarned = 0;
            if (score >= 30) starsEarned = 1;
            if (score >= 70) starsEarned = 2;
            if (score >= 100) starsEarned = 3;

            // Kaydetme ve Kilit Açma Mantığı
            let previousStars = userProgress[currentLevelIndex] ? userProgress[currentLevelIndex].stars : 0;
            
            // Yeni yıldız daha yüksekse kaydet
            if (starsEarned > previousStars) {
                userProgress[currentLevelIndex] = { stars: starsEarned, score: score, unlocked: true };
            } else if (!userProgress[currentLevelIndex]) {
                userProgress[currentLevelIndex] = { stars: starsEarned, score: score, unlocked: true };
            }

            // Bir sonraki leveli aç (eğer en az 1 yıldız alındıysa)
            if (starsEarned >= 1 && currentLevelIndex + 1 < 40) {
                if (!userProgress[currentLevelIndex + 1]) {
                    userProgress[currentLevelIndex + 1] = { stars: 0, score: 0, unlocked: true };
                } else {
                    userProgress[currentLevelIndex + 1].unlocked = true;
                }
            }

            localStorage.setItem('futbol_quiz_progress', JSON.stringify(userProgress));

            let starsDisplay = '☆☆☆';
            if (starsEarned === 1) starsDisplay = '⭐☆☆';
            if (starsEarned === 2) starsDisplay = '⭐⭐☆';
            if (starsEarned === 3) starsDisplay = '⭐⭐⭐';

            document.getElementById('result-stars').innerText = starsDisplay;
            document.getElementById('final-score-text').innerText = `Toplam Puanınız: ${score} / 100`;
        }

        function restartLevel() {
            startLevel(currentLevelIndex);
        }
    </script>
</body>
</html>
