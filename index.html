<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Bilgi Yarışması - 40 Level</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- GİRİŞ EKRANI ÖZEL STİLLERİ --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0a192f; z-index: 99999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        #splash-screen img.bg {
            width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: -1;
        }
        .loader-container {
            position: absolute; bottom: 80px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .loader-circle {
            position: relative; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center;
        }
        .loader-ring {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 4px solid transparent; border-top: 4px solid #a3e635; border-right: 4px solid #a3e635;
            animation: spin 1s linear infinite;
        }
        .loader-ball { font-size: 2rem; z-index: 2; animation: pulse 1.5s infinite; }
        .loading-text { color: #fff; font-family: sans-serif; font-size: 0.9rem; font-weight: bold; letter-spacing: 1px; text-align: center; }
        .loading-percent { font-size: 1.5rem; font-weight: 900; color: #a3e635; text-shadow: 0 0 10px rgba(163, 230, 53, 0.5); }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="splash-screen">
        <img src="splash-bg.jpg" alt="Futbol Bilgini" class="bg">
        <div class="loader-container">
            <div class="loader-circle">
                <div class="loader-ring"></div>
                <div class="loader-ball">⚽</div>
            </div>
            <div class="loading-text">YÜKLENİYOR...</div>
            <div class="loading-percent" id="splash-percent">0%</div>
        </div>
    </div>

    <div class="container">
        
        <!-- ÜST PANEL -->
        <div class="top-panel">
            <button class="settings-btn">⚙️</button>
            <div class="stat-box">
                <span class="stat-icon">⭐</span>
                <span id="total-stars-display">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-icon">🪙</span>
                <span id="total-coins-display">0</span>
                <button class="add-coin-btn">+</button>
            </div>
        </div>

        <h1>⚽ Futbol Bilgi Yarışması</h1>

        <!-- 1. ANA MENÜ -->
        <div id="menu-screen" class="screen active menu-screen">
            <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem; line-height: 1.6;">
                40 Farklı Level ve 400 Soruluk dev futbol arşivine hoş geldiniz!<br>
                Bilginizi test edin, tüm yıldızları toplayın.
            </p>
            <button class="menu-btn" onclick="showLevelScreen()">Oyuna Başla / Level Seç</button>
        </div>

        <!-- 2. LEVEL SEÇİM -->
        <div id="levels-screen" class="screen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-weight: bold; color: var(--text-color); font-size: 1.1rem;">Level Seçin</span>
                <button class="back-menu-btn" onclick="showMenuScreen()">← Ana Menü</button>
            </div>
            <div class="levels-container" id="levels-container"></div>
            
            <!-- YENİ: Reklam İzle Butonu -->
            <button class="ad-btn" onclick="watchAdForStars()">📺 Reklam izle (+5 ⭐ Kazan)</button>
        </div>

        <!-- 3. OYUN / QUIZ -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-info">
                <span id="level-title-indicator">Level 1</span>
                <span id="question-counter">Soru: 1 / 10</span>
                <span id="score-display">Puan: 0</span>
            </div>
            <div class="question-box" id="question-text">Soru yükleniyor...</div>
            <div class="options-list" id="options-container"></div>
            <div class="footer-nav">
                <button class="back-menu-btn" onclick="showLevelScreen()">Levellere Dön</button>
                <button class="action-btn" id="next-btn" onclick="nextQuestion()">Sonraki Soru</button>
            </div>
        </div>

        <!-- 4. SONUÇ -->
        <div id="score-screen" class="screen score-card">
            <h2>Level Tamamlandı!</h2>
            <div class="big-stars" id="result-stars">⭐⭐⭐</div>
            <p id="final-score-text" style="font-size: 1.1rem; margin-bottom: 10px;"></p>
            <div class="result-actions">
                <button class="back-menu-btn" onclick="showLevelScreen()">Level Listesi</button>
                <button class="action-btn" style="display:inline-block;" onclick="restartLevel()">Tekrar Oyna</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
