<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Bilgi Yarışması</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Giriş ekranı animasyonu */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- 0. GİRİŞ (SPLASH) EKRANI -->
    <div id="splash-screen">
        <img src="splash-bg.jpg" alt="Futbol Bilgini" class="bg">
        <div class="loader-container">
            <div class="loader-circle">
                <div class="loader-ring"></div>
                <div class="loader-ball">⚽</div>
            </div>
            <div class="loading-text">YÜKLENİYOR...</div>
            <div class="loading-percent" id="splash-percent">0%</div>
        </div>
    </div>

    <!-- 1. ANA MENÜ EKRANI -->
    <div id="menu-screen" class="screen active">
        <div class="top-panel">
            <div class="profile-box">
                <span class="profile-icon">👤</span>
                <span class="profile-name">Oyuncu</span>
            </div>
            <div class="stats-box">
                <span class="stat-icon">⭐</span>
                <span id="total-stars-display">0</span>
            </div>
            <div class="stats-box">
                <span class="stat-icon">🪙</span>
                <span id="total-coins-display">0</span>
            </div>
        </div>

        <div class="logo-container">
            <h1 class="game-logo">FUTBOL<br><span>BİLGİ YARIŞMASI</span></h1>
        </div>

        <div class="menu-buttons">
            <button class="menu-btn btn-play" onclick="showLevelScreen()">▶️ OYUNA BAŞLA</button>
            <button class="menu-btn btn-settings" onclick="showSettingsScreen()">⚙️ AYARLAR</button>
            <button class="menu-btn btn-howto" onclick="alert('Her levelde 10 soru vardır. Doğru cevaplarla yıldız ve coin kazan, sonraki levelleri aç!')">📖 NASIL OYNANIR</button>
        </div>
    </div>

    <!-- 2. AYARLAR EKRANI -->
    <div id="settings-screen" class="screen">
        <div class="settings-header">
            <h2>⚙️ Ayarlar</h2>
            <button class="back-menu-btn" onclick="showMenuScreen()">← Ana Menü</button>
        </div>
        <div class="settings-list">
            <div class="setting-item">
                <span>Ses Efektleri</span>
                <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
            </div>
            <div class="setting-item">
                <span>Titreşim</span>
                <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
            </div>
            <div class="setting-item">
                <span>Verileri Sıfırla</span>
                <button class="reset-btn" onclick="resetGame()">Sıfırla</button>
            </div>
        </div>
    </div>

    <!-- 3. LEVEL SEÇİM EKRANI -->
    <div id="levels-screen" class="screen">
        <div class="screen-header">
            <span style="font-weight: bold; color: #fff;">Level Seçin</span>
            <button class="back-menu-btn" onclick="showMenuScreen()">← Ana Menü</button>
        </div>
        <div class="levels-container" id="levels-container"></div>
        <button class="ad-btn" onclick="watchAdForStars()">📺 Reklam izle (+5 ⭐ Kazan)</button>
    </div>

    <!-- 4. OYUN / QUIZ EKRANI -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-header">
            <span id="question-counter">Soru 1/10</span>
            <div class="timer-circle">
                <span id="timer-text">30s</span>
            </div>
        </div>
        <div class="question-box" id="question-text">Soru yükleniyor...</div>
        <div class="options-list" id="options-container"></div>
    </div>

    <!-- 5. SONUÇ EKRANI -->
    <div id="score-screen" class="screen">
        <div class="score-content">
            <div class="big-stars" id="result-stars">⭐⭐⭐</div>
            <h2 id="final-score-text">SKOR: 0</h2>
            <p id="final-correct-text">Doğru Sayısı: 0/10</p>
            <button class="menu-btn btn-play" onclick="restartLevel()">🔄 TEKRAR OYNA</button>
            <button class="menu-btn btn-settings" onclick="showMenuScreen()">🏠 ANA MENÜ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
